<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Tracking Dashboard - ShareLoc</title>
    <!-- Panggil Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Panggil Leaflet CSS & JS (Peta Gratis Tanpa API Key) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        html, body, #map { height: 100%; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        .panel { position: absolute; top: 10px; left: 10px; background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.3); z-index: 1000; max-width: 300px; }
    </style>
</head>
<body>
    <div class="panel">
        <h3>Live Tracker</h3>
        <p id="status">Menunggu pergerakan target...</p>
        <p id="coords" style="font-size: 12px; color: #555;"></p>
    </div>
    
    <div id="map"></div>

    <script>
        let map, marker;
        
        // Terhubung otomatis ke Supabase Anda
        const supabaseUrl = 'https://idjfzymaywdimpfgkncq.supabase.co';
        const supabaseKey = 'sb_publishable_OMuw6k7doR0laJLJG4IPsq__cZgH...';
        const _supabase = supabase.createClient(supabaseUrl, supabaseKey);

        function initMap() {
            const defaultPos = [-6.9666, 110.4167]; // Default Semarang
            
            // Inisialisasi peta gratis
            map = L.map('map').setView(defaultPos, 16);

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '&copy; OpenStreetMap contributors'
            }).addTo(map);

            marker = L.marker(defaultPos).addTo(map)
                .bindPopup('Target Live Position')
                .openPopup();

            fetchLatestLocation();
            subscribeRealtime();
        }

        async function fetchLatestLocation() {
            const { data } = await _supabase
                .from('locations')
                .select('*')
                .order('created_at', { ascending: false })
                .limit(1);

            if (data && data.length > 0) {
                updateMapPosition(data[0].latitude, data[0].longitude, data[0].device_info);
            }
        }

        function subscribeRealtime() {
            _supabase
                .channel('public:locations')
                .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'locations' }, payload => {
                    const newLoc = payload.new;
                    updateMapPosition(newLoc.latitude, newLoc.longitude, newLoc.device_info);
                })
                .subscribe();
        }

        function updateMapPosition(lat, lng, deviceInfo) {
            const newLat = parseFloat(lat);
            const newLng = parseFloat(lng);
            
            marker.setLatLng([newLat, newLng]);
            map.setView([newLat, newLng], map.getZoom());
            
            document.getElementById('status').innerText = `Status: Terhubung (${deviceInfo})`;
            document.getElementById('coords').innerText = `Lat: ${lat}, Lng: ${lng}`;
        }

        window.onload = initMap;
    </script>
</body>
</html>
