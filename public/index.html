<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShareLoc - Live Sender</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; background: #f4f4f9; color: #333; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); display: inline-block; max-width: 400px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>ShareLoc Tracker</h2>
        <p id="status">Meminta izin akses lokasi GPS...</p>
        <p id="coords" style="font-size: 14px; color: #666;"></p>
    </div>

    <script>
        // Terhubung otomatis ke Supabase Anda
        const supabaseUrl = 'https://idjfzymaywdimpfgkncq.supabase.co';
        const supabaseKey = 'sb_publishable_OMuw6k7doR0laJLJG4IPsq__cZgH...';
        const _supabase = supabase.createClient(supabaseUrl, supabaseKey);

        if (navigator.geolocation) {
            navigator.geolocation.watchPosition(async (position) => {
                const lat = position.coords.latitude;
                const lng = position.coords.longitude;
                const deviceInfo = navigator.userAgent;

                document.getElementById('status').innerText = 'Status: Lokasi berhasil dikirim!';
                document.getElementById('coords').innerText = `Lat: ${lat}, Lng: ${lng}`;

                // Simpan koordinat terbaru ke tabel Supabase
                await _supabase.from('locations').insert([
                    { latitude: lat, longitude: lng, device_info: deviceInfo }
                ]);
            }, (error) => {
                document.getElementById('status').innerText = 'Gagal mengakses GPS: ' + error.message;
            }, {
                enableHighAccuracy: true,
                maximumAge: 0,
                timeout: 5000
            });
        } else {
            document.getElementById('status').innerText = 'Browser Anda tidak Mendukung Geolocation.';
        }
    </script>
</body>
</html>
